<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="CALLFORGE">
  <title>CALLFORGE — ASIC-inspired mark</title>
  <defs>
    <linearGradient id="cf-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C476"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8C6D1F"/>
    </linearGradient>
    <linearGradient id="cf-chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2230"/>
      <stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#cf-chip)"/>
  <!-- ASIC die -->
  <rect x="58" y="58" width="140" height="140" rx="16" fill="none" stroke="url(#cf-gold)" stroke-width="6"/>
  <rect x="82" y="82" width="92" height="92" rx="10" fill="none" stroke="url(#cf-gold)" stroke-width="4" opacity="0.85"/>
  <!-- forged C signal core -->
  <path d="M146 106a26 26 0 1 0 0 44" fill="none" stroke="#F2D98C" stroke-width="10" stroke-linecap="round"/>
  <circle cx="128" cy="128" r="7" fill="url(#cf-gold)"/>
  <!-- pins -->
  <g stroke="url(#cf-gold)" stroke-width="6" stroke-linecap="round">
    <path d="M88 58v-18"/><path d="M128 58v-18"/><path d="M168 58v-18"/>
    <path d="M88 216v-18"/><path d="M128 216v-18"/><path d="M168 216v-18"/>
    <path d="M58 88h-18"/><path d="M58 128h-18"/><path d="M58 168h-18"/>
    <path d="M216 88h-18"/><path d="M216 128h-18"/><path d="M216 168h-18"/>
  </g>
</svg>
