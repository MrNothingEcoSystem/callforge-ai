name: M01 quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - m01-baseline-stabilization

permissions:
  contents: read

jobs:
  verify:
    # Pin: ubuntu-latest moved to 26.04 on 2026-11-16 and intermittently fails
    # setup-node's pnpm-cache step with ERR_PNPM_CLI_PREFIX_IO_ERROR (ENOENT/EACCES
    # on the not-yet-created node_modules) before install ever runs. See PR #189.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          # setup-node's pnpm-cache probe (pnpm store path) fails intermittently
          # with ERR_PNPM_CLI_PREFIX_IO_ERROR/EACCES on the fresh workspace
          # (reproducible on ubuntu-24.04 and -26.04, 2026-11-26). Install is
          # fast enough without the store cache.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm audit
